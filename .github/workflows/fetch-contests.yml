name: Fetch Contest Calendar

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS
        run: curl -sf https://www.contestcalendar.com/calendar.rss -o contest-data.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contest-data.xml
          git diff --cached --quiet || git commit -m "chore: update contest calendar data"
          git push
